services:
  - type: web
    name: study-room-realtime
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: APP_ORIGIN
        sync: false
