name: Data retention
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retention
  cancel-in-progress: false
jobs:
  retention:
    if: vars.GUARDRAIL_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx scripts/guardrails.ts retention
        env:
          DATABASE_URL: ${{ secrets.GUARDRAIL_DATABASE_URL }}
      - run: npx tsx scripts/guardrails.ts check
        env:
          DATABASE_URL: ${{ secrets.GUARDRAIL_DATABASE_URL }}
