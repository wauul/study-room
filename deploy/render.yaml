services:
  - type: web
    name: study-room-realtime
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run server:build
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: APP_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        value: study-room-iq
      - key: SENTRY_PROJECT
        value: study-room-realtime
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_TRACE_ORIGINS
        sync: false
      - key: SENTRY_LOGS_ENABLED
        value: "false"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0"
      - key: SENTRY_SMOKE_ENABLED
        value: "false"
